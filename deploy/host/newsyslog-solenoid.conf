# Log rotation for the launchd jobs. launchd appends to StandardOutPath forever
# and rotates nothing; on an always-on box that is a disk filling up quietly.
#
#   sudo cp deploy/host/newsyslog-solenoid.conf /etc/newsyslog.d/solenoid.conf
#   sudo newsyslog -nv        # dry run, prints what it would do
#
# G = the filename is a glob. J = compress with bzip2.
# Rotate at 10MB, keep 7.
# logfilename                                 [owner:group]  mode count size when  flags
/Users/eli/Library/Logs/solenoid/*.log        eli:staff      644  7     10240 *    GJ
