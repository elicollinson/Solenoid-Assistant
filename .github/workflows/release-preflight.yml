name: release preflight

# Runs on every PR (no paths filter): branch protection requires these jobs,
# and a required check that never starts would block docs-only PRs forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: solenoid-assistant-release-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same gate as release.yml's quality job, so a PR cannot merge with a failing
  # typecheck or test and only discover it in the post-merge release.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  arm64-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the production image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          pull: true
          load: true
          tags: solenoid-assistant:release-preflight
          build-args: |
            VERSION=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Scan fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: solenoid-assistant:release-preflight
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

