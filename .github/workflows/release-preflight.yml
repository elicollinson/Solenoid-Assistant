name: release preflight

# Runs on every PR (no paths filter): branch protection requires these jobs,
# and a required check that never starts would block docs-only PRs forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: solenoid-assistant-release-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same gate as release.yml's quality job, so a PR cannot merge with a failing
  # typecheck or test and only discover it in the post-merge release.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  arm64-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          pull: true
          load: true
          tags: solenoid-assistant:release-preflight
          build-args: |
            VERSION=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Scan fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: solenoid-assistant:release-preflight
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

