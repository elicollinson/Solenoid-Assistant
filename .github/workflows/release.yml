name: release

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/release.yml
      - bun.lock
      - deploy/Dockerfile
      - drizzle/**
      - package.json
      - scripts/**
      - src/**
      - tsconfig.json
      - web/**
  workflow_dispatch: {}

concurrency:
  group: solenoid-assistant-release
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  image:
    needs: quality
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ghcr.io/elicollinson/solenoid-assistant@${{ steps.push.outputs.digest }}
    steps:
      # mini-cloud is private while this repository is public. GitHub forbids
      # public workflows from calling private reusable workflows, so this job
      # mirrors mini-cloud's build-publish.yml until their visibility aligns.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: ghcr.io/elicollinson/solenoid-assistant:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/elicollinson/solenoid-assistant@${{ steps.push.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published ghcr.io/elicollinson/solenoid-assistant@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  request-promotion:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Request a digest-pinning promotion PR
        env:
          DISPATCH_TOKEN: ${{ secrets.MINI_CLOUD_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image-ref }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN" || {
            echo "::error::MINI_CLOUD_DISPATCH_TOKEN is not configured"
            exit 1
          }
          payload="$(jq -n \
            --arg app "solenoid-assistant" \
            --arg image_ref "$IMAGE_REF" \
            '{event_type:"promote-image",client_payload:{app:$app,image_ref:$image_ref}}')"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/elicollinson/mini-cloud/dispatches
